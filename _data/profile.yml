summary: >
  Research mathematician and educator with 7+ years of international teaching
  experience, both in person and online, across Saudi Arabia and Uzbekistan. My
  research focuses on fractional-order partial differential equations,
  degenerate and singular operators, and direct and inverse problems. I hold a
  Doctor of Sciences in Mathematics from Ghent University (Belgium) and a Ph.D.
  in Physical and Mathematical Sciences from the V.I. Romanovskiy Institute of
  Mathematics, Uzbekistan Academy of Sciences.


  Today I am bridging theoretical mathematics with scientific computing in
  Python and Physics-Informed Neural Networks (PINNs) to solve complex boundary
  value problems. I am the author of 8+ Scopus-indexed publications (h-index 4)
  and have extensive experience delivering English-medium courses in Calculus
  I–II, Differential Equations, Finite Mathematics, Business Mathematics and
  Applied Mathematics.
research_statement: >
  My work studies how solutions behave when a physical process "remembers" its
  past. Fractional-order derivatives — such as the Caputo, Riemann–Liouville,
  Hilfer and hyper-Bessel operators — describe anomalous diffusion,
  viscoelasticity and other memory effects. I study the existence and uniqueness
  of solutions for direct and inverse problems for such equations, including
  mixed-type and degenerate equations with singular coefficients, and I recover
  unknown sources from measured data.


  More recently, I combine these analytical results with scientific computing in
  Python and Physics-Informed Neural Networks (PINNs, DeepXDE) to approximate
  solutions of boundary value problems numerically.
